name: Update Visa Bulletin & News

# The Department of State publishes the next month's Visa Bulletin
# between the 9th and the 16th. We poll once a day in that window so we
# pick it up the morning it goes live, then stop until the next month.
# The news fetcher runs in the same job so headlines stay fresh.
#
# Required secrets: only the default GITHUB_TOKEN — no extra setup.
on:
  schedule:
    # 12:00 UTC = 08:00 ET — daily on days 9..16 of every month
    - cron: '0 12 9-16 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Bulletin month (e.g. may). Leave blank to auto-detect latest.'
        required: false
      year:
        description: 'Bulletin year (e.g. 2026). Leave blank for current year.'
        required: false

permissions:
  contents: write

jobs:
  update:
    name: Fetch bulletin + news, commit to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Report how old the committed data is before we touch the network, so
      # the log shows the starting state even if a later step explodes. This
      # form never fails the job — see the enforcing check at the end.
      - name: Check bulletin freshness (pre-fetch report)
        run: node scripts/check-bulletin-freshness.js --warn-only

      # The script now owns the exit-code semantics: it exits 0 both when it
      # updates the data and when the bulletin genuinely isn't published yet
      # (404), and non-zero only on real failures — blocked (403), server
      # error, network failure, or a parse break. So no swallowing here: any
      # non-zero exit turns the run red and triggers the failure notification.
      - name: Fetch visa bulletin
        id: bulletin
        env:
          INPUT_MONTH: ${{ github.event.inputs.month }}
          INPUT_YEAR: ${{ github.event.inputs.year }}
          # Primary fetch path (ScraperAPI proxy). If unset/invalid, the script
          # falls back to the Wayback Machine automatically.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          ARGS=""
          if [ -n "$INPUT_MONTH" ]; then ARGS="$ARGS --month=$INPUT_MONTH"; fi
          if [ -n "$INPUT_YEAR"  ]; then ARGS="$ARGS --year=$INPUT_YEAR";  fi
          node scripts/fetch-visa-bulletin.js $ARGS

      # No continue-on-error: silence here is what let the USCIS RSS feeds sit
      # dead. The script exits 1 when the newsroom is unreachable and 2 when
      # the page parses to zero items, and either should be seen.
      - name: Fetch immigration news
        if: always()
        run: node scripts/fetch-news.js

      # if:always() from here down so a blocked bulletin doesn't strand an
      # otherwise-good news update. The run still reports red — we just don't
      # throw away work that succeeded.
      - name: Detect changes
        id: diff
        if: always()
        run: |
          if git diff --quiet -- src/data/visaBulletin.js src/data/news.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build still passes
        if: always() && steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit & push to main
        if: always() && steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/visaBulletin.js src/data/news.js
          git commit -m "chore(data): auto-update visa bulletin & news ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main

      - name: Skip — nothing to commit
        if: always() && steps.diff.outputs.changed != 'true'
        run: echo "No new bulletin or news content — exiting cleanly."

      # Runs last, and always: whatever happened above, if the committed data
      # is still older than one publish cycle then this workflow is not doing
      # its job, and the run must go red. This is the backstop that would have
      # caught the July 2026 silent-403 outage on day one instead of day 34.
      # Placed after the commit so a legitimate update is never blocked by it.
      - name: Enforce bulletin freshness
        if: always()
        run: node scripts/check-bulletin-freshness.js
